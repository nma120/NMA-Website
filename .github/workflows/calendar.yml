name: Update events from the calendar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record new sponsorships on the calendar
        env:
          ZEFFY_API_KEY: ${{ secrets.ZEFFY_API_KEY }}
          ZEFFY_CAMPAIGN_ID: ${{ secrets.ZEFFY_CAMPAIGN_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/apply_sponsorships.py
      - run: python scripts/update_calendar.py
      - name: Save the event list when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update events from the calendar."
            git push
          fi
